<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference — Three Little Worlds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">
    <h1>Spot the Difference</h1>
    <p id="sceneName">Three little worlds</p>
  </div>
  <div class="stats">
    <div class="stat"><span class="label">Round</span><span id="roundLabel">1 / 3</span></div>
    <div class="stat"><span class="label">Found</span><span id="foundLabel">0 / 5</span></div>
    <div class="stat"><span class="label">Score</span><span id="scoreLabel">0</span></div>
    <div class="stat"><span class="label">Time</span><span id="timeLabel">2:00</span></div>
    <button id="hintBtn" type="button">Hint (2)</button>
    <button id="muteBtn" type="button">Sound: on</button>
  </div>
</header>
<main>
  <div class="boards">
    <div class="panel"><div class="panel-tag">A</div><canvas id="canvasA" width="480" height="360"></canvas></div>
    <div class="panel"><div class="panel-tag">B</div><canvas id="canvasB" width="480" height="360"></canvas></div>
  </div>
  <p class="tip">Click a difference on either picture. Wrong clicks cost 3 seconds.</p>
</main>
<div id="overlay" class="overlay">
  <div class="card" id="overlayCard"></div>
</div>
<script src="scenes.js"></script>
<script src="main.js"></script>
</body>
</html>
